# Copia única de la base de datos vieja (Neon creado por Vercel) a la nueva (Neon São Paulo).
# Usa dos secretos del repositorio: OLD_DATABASE_URL y NEW_DATABASE_URL (direcciones SIN "-pooler").
# Se ejecuta a mano (Actions → «Copiar base de datos» → Run workflow) o al cambiar
# .github/copiar-base.trigger. No sobrescribe: si la base nueva ya tiene tablas, se detiene.
name: Copiar base de datos

on:
  workflow_dispatch:
  push:
    paths:
      - .github/copiar-base.trigger

jobs:
  copiar:
    runs-on: ubuntu-latest
    container: postgres:18
    env:
      OLD_DATABASE_URL: ${{ secrets.OLD_DATABASE_URL }}
      NEW_DATABASE_URL: ${{ secrets.NEW_DATABASE_URL }}
    steps:
      - name: Revisar secretos
        run: |
          if [ -z "$OLD_DATABASE_URL" ] || [ -z "$NEW_DATABASE_URL" ]; then
            echo "::error::Faltan los secretos OLD_DATABASE_URL y/o NEW_DATABASE_URL (Settings → Secrets and variables → Actions)."
            exit 1
          fi
          case "$OLD_DATABASE_URL$NEW_DATABASE_URL" in
            *-pooler*) echo "::error::Usa direcciones sin '-pooler' (desactiva Connection pooling en Neon → Connect)."; exit 1 ;;
          esac

      - name: Revisar que la base nueva esté vacía
        run: |
          TABLAS=$(psql "$NEW_DATABASE_URL" -tAc "select count(*) from information_schema.tables where table_schema in ('public','drizzle')")
          echo "Tablas en la base nueva: $TABLAS"
          if [ "$TABLAS" != "0" ]; then
            echo "::error::La base nueva ya tiene tablas. No se copia para no sobrescribir nada."
            exit 1
          fi

      - name: Copiar (pg_dump | pg_restore)
        run: |
          pg_dump "$OLD_DATABASE_URL" --format=custom --no-owner --no-privileges \
            | pg_restore --no-owner --no-privileges --exit-on-error -d "$NEW_DATABASE_URL"

      - name: Comparar cantidades
        run: |
          for t in products orders settings admin_users categories inquiries product_images; do
            a=$(psql "$OLD_DATABASE_URL" -tAc "select count(*) from public.$t")
            b=$(psql "$NEW_DATABASE_URL" -tAc "select count(*) from public.$t")
            echo "$t: vieja=$a nueva=$b"
            [ "$a" = "$b" ] || { echo "::error::No coincide $t"; exit 1; }
          done
          echo "Copia completa y verificada."
